services:
  # Contenedor de la base de datos
  database:
    container_name: database
    image: postgres:16
    environment:
      POSTGRES_DB: db_inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: proyecto_poo
    ports:
      - "5433:5432"
    volumes:
      - db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres}"]

  # Contenedor de la api
  backend:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/db_inventario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: proyecto_poo
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_datos: