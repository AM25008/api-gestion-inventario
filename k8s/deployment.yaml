apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-api
  template:
    metadata:
      labels:
        app: inventario-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: inventario-api
          image: ghcr.io/am25008/api-gestion-inventario:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
            requests:
              memory: "256Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"