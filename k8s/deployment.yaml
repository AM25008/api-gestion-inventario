apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-api
  template:
    metadata:
      labels:
        app: inventario-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: inventario-api
          image: ghcr.io/am25008/api-gestion-inventario:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:h2:mem:testdb"
          resources:
            limits:
              memory: "1024Mi"
            requests:
              memory: "512Mi"